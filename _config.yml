# ============================================================
# 简历正文，content节点下，
#
# 每段以 "- title:" 开头，layout 有两类：
#   list = 条目式（适合工作经历 / 项目经验 / 教育）
#   text = 纯文本（适合技能清单 / 自我评价）
#
# list 条目支持的键（title 必填，其余可选）：
# 条目是单栏叙事排版：标题与时间同行，下面依次是副标题 / 简介 / 正文
#   title        条目标题（如公司名、项目名），必填
#   caption      右上角的时间，如 2026.01 - 2026.08
#   sub_title    标题下方的副标题（如职位名 / 专业），用主题色
#   quote        简介段（灰色斜体）
#   description  正文，Markdown；第一段纯文本会渲染成"技术栈"样式
#                （灰色小字，区别于 bullet 列表）
#   border       条目间虚线分隔：不写 = 有分隔线（weak）；写 no = 这条不要线
#   link / link_text        条目末尾的单个链接（后者是显示文字，不写显示 URL）
#
# 每段都可以点击标题折叠。两个可选字段：
#   collapsed: true   是否折叠，true = 收起，false = 展开，不写默认
#
#   id: education     折叠状态用哪个键记、锚点用哪个 id。
#                     不写则用标题（中文标题也能直接用）。改标题又想保住
#                     老访客的折叠选择时，写上它。
#
# 用户点过之后以用户的选择为准，配置里的默认值只在没点过时生效。
# ============================================================

content:

  # ---------------------------------------------------------
  # 专业技能（text 布局，直接用 Markdown 写）
