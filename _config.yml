  - title: 专业技能
    layout: text
    content: | # 这里整体是 Markdown，随便排版
      - JDK 21 虚拟线程与 CompletableFuture 异步编排，有 3 倍吞吐提升的线上实践
      - Spring Cloud Gateway / Nacos / OpenFeign / Sa-Token，落地网关统一动态鉴权
      - MySQL 索引设计与执行计划分析、深分页优化，封装统一分页，杜绝 ORDER BY 注入
      - 注解式 MyBatis 字段加解密、HMAC-SHA256 盲索引，出库解密 / 出参脱敏 / 日志脱敏三层分离
      - Redis + Caffeine 多级缓存，Pub / Sub 广播失效 + fail-closed 容灾设计
      - 主导设计异步导出框架（启动期全覆盖校验）、零侵入审计组件，均已在组内复用
      - 基于 RocketMQ 的异步解耦与最终一致，幂等消费保障跨系统数据一致性
      - 策略 / 模板方法 / 责任链 / 状态机、函数式接口、充血模型，在导出框架与规则引擎中落地
      - Docker 部署 Ollama 跑 Embedding 模型、翻译模型，供大模型 Function Calling 调用
      - Spring AI 本地实践带 RAG 的对话应用，实现工具调用、SSE 流式输出与上下文记忆压缩



  - title: 项目经验
    layout: list
    content:
      - layout: left
        title: 航司问卷投放平台
        sub_title: 核心开发
        quote: >
          为出行乘客精准筛选目标人群并推送满意度问卷，解决旧系统漏抓航班、日投放仅 2 万+ 的问题。
        description: |
          技术栈：Spring Boot 3.5 / Spring Cloud / OceanBase / MyBatis-Plus / Redis / Nacos / RocketMQ

          - 将耦合大任务拆为 ready / filter / send 状态机流水线，经 RocketMQ 投递解耦、幂等回写，各阶段可独立调度
          - 重构后彻底解决漏抓航班，日投放 2 万+ → 6 万+，单节点余量可支撑业务增长至 8~10 万
          - 设计注解式 MyBatis 字段加解密拦截器，落库自动加密、出库自动解密，业务代码零侵入
          - 基于 HMAC-SHA256 设计盲索引，密文列支持明文等值查询；空值不生成索引，规避空串哈希碰撞
          - 出库解密 / 出参脱敏 / 日志脱敏三层分离，确保敏感数据不漏入日志
          - 动态规则配置表 + 优先级匹配器链实现多条件短路，业务零代码上线新规则，节省上线周期 ≥1 个月
          - 规则 ID + 名称写入 MDC，贯穿筛选流程，支持按规则维度排障与条件命中分布统计
          - 虚拟线程 + CompletableFuture 并发编排，筛选吞吐提升约 3 倍
          - 函数式接口辅助实现 15 个二级维度的统计，导出报表后对接 AI 自动生成分析结论

      - layout: left
        title: 航司问卷调研平台
        sub_title: 核心开发
        quote: >
          面向乘客投放调研问卷的运营平台，覆盖问卷配置到统计分析全链路，重点保障鉴权高可用与数据合规。
        description: |
          技术栈：Spring Boot 3.5 / Spring Cloud / Sa-Token / Redis / OceanBase / MyBatis-Plus / RocketMQ

          - 菜单权限码与"路径 → 权限"映射收敛到网关统一判定，鉴权热路径零数据库查询
          - 权限缓存 Redis + Caffeine 多级结构，Pub / Sub 广播刷新各网关节点本地缓存，保证多节点缓存一致
          - 缓存 fail-closed 语义：回源失败退避重试而非放行，配合超管降级通道兼顾安全与可修复性
          - 权限收回差异化分派：改角色覆盖账号级会话快照即时生效、用户禁用 / 删除强制下线
          - 角色 / 菜单授权叠加团队归属维度（多租户），统一从登录态取团队 ID 过滤，杜绝漏条件越权
          - 网关过滤器按路径反查操作描述 + traceId 透传，实现 100% 全接口操作审计，已在组内复用
          - 通用异步导出框架：策略 / 模板模式 + 启动期全覆盖校验快速失败，新场景接入效率提升 70%+
          - 扩展 BaseMapper 封装统一分页，排序走字段白名单，杜绝任意列排序与 ORDER BY 注入
          - 调度中心基于 Quartz，Spring Bean 方法注册任务，支持并发策略、misfire 策略与下次触发时间预览
          - 主导对接客户 OA 审批中心，封装 OaClient 屏蔽接口细节，MQ 异步回执实现跨系统最终一致





